<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planning — Sky Art Creations</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="skyArt.css">
</head>
<body class="planning-body">

  <!-- Top bar -->
  <div style="
    position:sticky;top:0;z-index:100;
    background:rgba(4,6,13,0.95);
    border-bottom:1px solid rgba(56,189,248,0.12);
    padding:0 40px;height:70px;
    display:flex;align-items:center;justify-content:space-between;
    backdrop-filter:blur(20px);
  ">
    <a href="index.html" style="font-family:'Rajdhani',sans-serif;font-size:1.4rem;font-weight:700;color:#fff;text-decoration:none">
      Sky <span style="color:#38bdf8">Art</span>
    </a>
    <button onclick="window.history.back()" style="
      display:inline-flex;align-items:center;gap:8px;
      background:rgba(56,189,248,0.08);border:1px solid rgba(56,189,248,0.12);
      color:#38bdf8;padding:10px 20px;border-radius:50px;cursor:pointer;
      font-family:'Rajdhani',sans-serif;font-size:0.95rem;font-weight:700;
      transition:all 0.3s;
    " onmouseover="this.style.background='#0ea5e9';this.style.color='#fff'"
       onmouseout="this.style.background='rgba(56,189,248,0.08)';this.style.color='#38bdf8'">
      <i class="fas fa-arrow-left"></i> Terug
    </button>
  </div>

  <div class="container planning-page">
    <header class="planning-header" style="margin-top:40px">
      <h1 class="planning-title"><i class="fas fa-calendar-alt"></i> Project Planningsoverzicht</h1>
      <p class="planning-subtitle">Bekijk de beschikbare tijdslots voor uw vliegtuigspuitproject en reserveer direct.</p>
    </header>

    <div class="planning-layout">

      <div class="calendar-panel">
        <div class="calendar-controls">
          <div class="calendar-view-toggle">
            <button class="view-btn active" data-view="week"><i class="fas fa-calendar-week"></i> Week</button>
            <button class="view-btn" data-view="month"><i class="fas fa-calendar"></i> Maand</button>
          </div>
          <div class="calendar-navigation">
            <button class="nav-btn"><i class="fas fa-chevron-left"></i></button>
            <span class="current-period">Week 50 — 8/12 t/m 14/12</span>
            <button class="nav-btn"><i class="fas fa-chevron-right"></i></button>
          </div>
        </div>

        <div id="calendarGrid" class="calendar-grid">
          <div class="calendar-placeholder" style="grid-column:1/-1;padding:60px;text-align:center">
            <i class="fas fa-plane-up" style="font-size:3rem;color:rgba(56,189,248,0.2);display:block;margin-bottom:16px"></i>
            <p style="color:var(--c-muted)">Planning laden…</p>
          </div>
        </div>

        <div class="legend">
          <span><span class="legend-color free"></span> Vrij</span>
          <span><span class="legend-color reserved"></span> Gereserveerd</span>
          <span><span class="legend-color maintenance"></span> Onderhoud</span>
        </div>
      </div>

      <div class="summary-panel">
        <h2 class="panel-title"><i class="fas fa-info-circle"></i> Geselecteerd slot</h2>

        <div id="summaryCard" class="summary-card">
          <div class="status-icon"><i class="fas fa-clock"></i></div>
          <h3 class="card-status">Geen slot geselecteerd</h3>
          <p class="card-detail">Klik op een groen slot om te reserveren.</p>

          <div class="slot-details-hidden">
            <div class="detail-row"><i class="fas fa-calendar-day"></i> Datum: <span id="slotDate">--</span></div>
            <div class="detail-row"><i class="fas fa-clock"></i> Tijd: <span id="slotTime">--</span></div>

            <div class="form-group-slot">
              <label for="inputAircraftType"><i class="fas fa-plane"></i> Vliegtuig type</label>
              <input type="text" id="inputAircraftType" placeholder="bv. Cessna 172" class="tech-input">
            </div>
            <div class="form-group-slot">
              <label for="inputDuration"><i class="fas fa-hourglass-start"></i> Geschatte duur</label>
              <select id="inputDuration" class="tech-input">
                <option value="3">3 dagen (Klein)</option>
                <option value="5">5 dagen (Middel)</option>
                <option value="7">7 dagen (Groot)</option>
              </select>
            </div>

            <button class="reserve-btn">
              <i class="fas fa-paper-plane"></i> Offerte aanvragen
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="skyArt.js"></script>
</body>
</html>
